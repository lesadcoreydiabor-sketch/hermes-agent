version: 1
project: hermes-agent
capability: hermes-run-inspector
source_prd: docs/plans/hermes-run-inspector-prd.md
related_prds:
  - docs/plans/hermes-run-inspector-prd.md
  - docs/plans/hermes-run-inspector-desktop-panel-requirements.md
  - docs/plans/hermes-run-inspector-desktop-panel-prd.md
  - docs/plans/hermes-run-inspector-event-integration-prd.md
owner: product-manager
mode: implementation

tasks:
  - id: HRI-01
    title: Define read-only run snapshot schema
    description: Add a versioned schema for run status, last activity, active tool summary, MCP health, recovery hint, and privacy flags.
    depends_on: []
    acceptance:
      - Snapshot has version, run_id, source, status, reason, workspace, session_id, last_activity_at, active_tool, mcp_health, recovery_hint, privacy_flags, and degraded_reason fields.
      - Snapshot excludes raw prompts, secrets, full file contents, raw logs, and full tool arguments.
      - Missing data is represented as unknown or null, not guessed.
    verify:
      - pytest tests/runtime/test_run_snapshot_schema.py
    status: completed
    risk: low

  - id: HRI-02
    title: Collect session and resume state
    description: Build a read-only adapter over existing session/gateway state without changing persistence or run behavior.
    depends_on:
      - HRI-01
    acceptance:
      - Active, idle, completed, failed, stopped, and unknown states map into snapshot status.
      - Resume-pending or degraded session state returns a recovery_hint when available.
      - Missing or corrupt state returns degraded_reason instead of raising an uncaught exception.
    verify:
      - pytest tests/runtime/test_run_snapshot_session.py
    status: completed
    risk: medium

  - id: HRI-03
    title: Collect tool and MCP health
    description: Summarize active tool state, ToolRegistry availability, and MCP server health without dispatching tools or refreshing remote servers.
    depends_on:
      - HRI-01
    acceptance:
      - Active tool summary includes name, call_id when available, and duration_ms when available.
      - Tool summary reports available, unavailable, running, failed, or unknown.
      - MCP summary reports connected, degraded, failed, or unknown state.
      - Inspector does not reconnect, refresh, register, deregister, or dispatch MCP tools.
    verify:
      - pytest tests/runtime/test_run_snapshot_tools_mcp.py
    status: completed
    risk: medium

  - id: HRI-04
    title: Add redaction and privacy tests
    description: Centralize snapshot redaction rules before exposing the snapshot through CLI or API.
    depends_on:
      - HRI-01
      - HRI-02
      - HRI-03
    acceptance:
      - Secret-like values, raw prompts, file bodies, raw logs, and full tool args are omitted or summarized.
      - Tests cover string args, dict args, non-dict args, nested secret-looking fields, and large payload summaries.
      - Each exposed field is safe, redacted, local_only, or unknown.
    verify:
      - pytest tests/runtime/test_run_snapshot_redaction.py
    status: completed
    risk: high

  - id: HRI-05
    title: Expose local read-only status surface
    description: Add a local CLI command or existing API/status extension that prints the current run snapshot.
    depends_on:
      - HRI-02
      - HRI-03
      - HRI-04
    acceptance:
      - User can request status without starting, stopping, retrying, resuming, reconnecting, or mutating a run.
      - Output includes status, last activity, active tool, MCP health, recovery hint, and degraded-state explanation.
      - Command/API returns successfully when optional resource data is unavailable.
    verify:
      - pytest tests/hermes_cli/test_run_status.py
    status: completed
    risk: medium

  - id: HRI-06
    title: Add failure review and regression capture
    description: Ensure failed verification or redaction problems become badcases, tests, or task updates before implementation continues.
    depends_on:
      - HRI-05
    acceptance:
      - Failed verification records what happened, why it failed, what changed, how it was verified, and what regression was added.
      - Redaction failures are treated as blockers.
      - Repeated unknown-state failures produce a new regression case or a task.yaml update.
    verify:
      - manual review of failure review entry after one simulated failed test
    status: completed
    risk: medium

  - id: HRIDP-01
    title: Finalize issue-grounded desktop panel PRD
    description: Convert GitNexus code evidence and issue evidence from adjacent HERMES UI projects into a formal Run Inspector Desktop Panel PRD.
    depends_on:
      - HRI-06
    acceptance:
      - PRD references HERMES P0 Run Inspector as the source data contract.
      - PRD separates code evidence, issue evidence, transferable patterns, non-goals, and risks.
      - PRD explicitly keeps P1 read-only and excludes installer, config editor, gateway write controls, terminal streaming, and raw logs.
      - PRD includes an execution contract for API, hook, panel, sidebar, session/chat entry, resilience tests, and desktop wrapper decision.
    verify:
      - manual review of docs/plans/hermes-run-inspector-desktop-panel-prd.md
      - git diff --check -- docs/plans/hermes-run-inspector-desktop-panel-prd.md
    status: completed
    risk: low

  - id: HRIDP-02
    title: Add read-only Run Inspector dashboard API
    description: Add an additive local dashboard endpoint backed by the P0 Run Inspector snapshot contract.
    depends_on:
      - HRIDP-01
    acceptance:
      - GET /api/run-inspector returns a privacy-safe snapshot envelope with refreshed_at.
      - Endpoint does not start, stop, resume, retry, reconnect, refresh MCP, dispatch tools, or write config.
      - Missing collector data returns unknown or degraded state without crashing the dashboard API.
      - API tests cover success, unknown state, collector failure, and redaction.
    verify:
      - venv/Scripts/python.exe -m pytest tests/hermes_cli/test_run_inspector_api.py -q -o addopts=
      - venv/Scripts/python.exe -m pytest tests/runtime/test_run_snapshot_schema.py tests/runtime/test_run_snapshot_redaction.py -q -o addopts=
    status: completed
    risk: medium

  - id: HRIDP-03
    title: Add Run Inspector client hook
    description: Add a frontend data hook for the dashboard panel with bounded timeout, backoff, auth-failure handling, and manual refresh.
    depends_on:
      - HRIDP-02
    acceptance:
      - Hook maps API states to loading, ready, degraded, auth_failed, offline, and unknown.
      - Request timeout is bounded.
      - Repeated failures use backoff.
      - Auth failure stops polling and surfaces auth state.
      - Hook exposes manual refresh without triggering gateway or config actions.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
    status: completed
    risk: medium

  - id: HRIDP-04
    title: Add full Run Inspector dashboard panel
    description: Render the P0 snapshot in a dashboard panel with status, session, active tool, MCP/tool health, recovery hint, degraded reason, privacy flags, and refresh state.
    depends_on:
      - HRIDP-03
    acceptance:
      - Panel shows running, waiting, failed, degraded, unknown, auth_failed, and offline states.
      - Panel never renders raw prompts, raw logs, secrets, file bodies, environment values, or full tool arguments.
      - Long tool names, call ids, and argument summaries do not overflow their containers.
      - Empty and no-snapshot states are explicit and not treated as fatal errors.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - Invoke-WebRequest http://127.0.0.1:9121/run-inspector
      - Invoke-WebRequest http://127.0.0.1:9121/api/run-inspector with dashboard session token
    status: completed
    risk: medium

  - id: HRIDP-05
    title: Add sidebar Run Inspector signal
    description: Add a compact sidebar status signal that routes to the full Run Inspector panel.
    depends_on:
      - HRIDP-04
    acceptance:
      - Sidebar maps snapshot state to running, waiting, failed, degraded, unknown, or unavailable.
      - Sidebar signal opens or routes to the full panel.
      - Sidebar polling is slower than panel polling or uses shared cached state.
      - API unavailable state does not block navigation.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - Invoke-WebRequest http://127.0.0.1:9121/run-inspector
      - Invoke-WebRequest http://127.0.0.1:9121/api/run-inspector with dashboard session token
    status: completed
    risk: low

  - id: HRIDP-06
    title: Add Sessions and Chat diagnostic entry points
    description: Add links from session and chat surfaces into the Run Inspector panel without requiring run mutation.
    depends_on:
      - HRIDP-05
    acceptance:
      - Sessions page can link to the current or latest run diagnostic when a snapshot exists.
      - Chat page can link to current run diagnostics when embedded chat is enabled.
      - No-snapshot state is shown as unavailable, not an error.
      - Entry points do not start, stop, resume, retry, reconnect, or mutate gateway state.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - Invoke-WebRequest http://127.0.0.1:9121/run-inspector
      - Invoke-WebRequest http://127.0.0.1:9121/api/run-inspector with dashboard session token
    status: completed
    risk: low

  - id: HRIDP-07
    title: Add resilience, privacy, and UI regression coverage
    description: Verify that the Run Inspector panel cannot enter infinite loading, auth retry loops, privacy leaks, layout overflow, or platform-specific shell assumptions.
    depends_on:
      - HRIDP-06
    acceptance:
      - Backend and frontend tests cover timeout, degraded state, auth failure, backoff, and manual refresh.
      - UI tests include long tool names, long summaries, and secret-looking values.
      - Manual browser screenshots confirm no overlap at desktop and narrow widths.
      - Feature does not require /bin/bash or hardcoded Unix paths on Windows.
      - Any failed verification creates a failure_review entry or regression test before continuing.
    verify:
      - venv/Scripts/python.exe -m pytest tests/hermes_cli/test_run_inspector_api.py tests/runtime/test_run_snapshot_schema.py tests/runtime/test_run_snapshot_redaction.py -q -o addopts=
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - Playwright screenshot check for desktop and narrow /run-inspector viewports
    status: completed
    risk: high

  - id: HRIDP-08
    title: Decide desktop wrapper scope
    description: Produce a short decision note on whether a separate desktop wrapper is justified after the read-only dashboard panel is stable.
    depends_on:
      - HRIDP-07
    acceptance:
      - Decision considers platform compatibility, install detection, remote mode, config writes, and support burden.
      - Decision does not add installer or gateway control scope to P1.
      - If a wrapper is recommended, a separate PRD and task.yaml slice are created.
    verify:
      - manual review of desktop wrapper decision note
      - git diff --check -- docs/plans/hermes-desktop-wrapper-decision.md .hermes/task.yaml
    status: completed
    risk: low

  - id: HRIE-01
    title: Define Run Inspector event contract
    description: Add an issue- and code-grounded P2 PRD plus .hermes execution slice for read-only event integration.
    depends_on:
      - HRIDP-08
    acceptance:
      - PRD defines event fields, privacy exclusions, non-goals, risks, and verification.
      - Task contract separates ledger, API, WebSocket, UI timeline, and verification work.
      - P2 scope stays read-only and excludes run mutation or gateway controls.
    verify:
      - manual review of docs/plans/hermes-run-inspector-event-integration-prd.md
      - git diff --check -- docs/plans/hermes-run-inspector-event-integration-prd.md .hermes/task.yaml
    status: completed
    risk: low

  - id: HRIE-02
    title: Add bounded redacted event ledger
    description: Create a local in-memory event ledger for normalized Run Inspector events.
    depends_on:
      - HRIE-01
    acceptance:
      - Ledger stores bounded recent events only.
      - Ledger redacts secret-looking values and truncates long summaries.
      - Ledger normalizes dashboard chat event frames into the P2 event contract.
      - Ledger exposes a replayable subscriber queue without blocking event producers.
    verify:
      - venv/Scripts/python.exe -m pytest tests/runtime/test_run_inspector_events.py -q -o addopts=
    status: completed
    risk: medium

  - id: HRIE-03
    title: Expose read-only Run Inspector event APIs
    description: Add dashboard-protected recent-events and live event subscription endpoints.
    depends_on:
      - HRIE-02
    acceptance:
      - GET /api/run-inspector/events returns ok, events, and refreshed_at.
      - WS /api/run-inspector/events sends initial replay and new events.
      - Endpoints do not start, stop, resume, retry, reconnect, or dispatch tools.
      - Missing events returns an empty list, not a dashboard failure.
    verify:
      - venv/Scripts/python.exe -m pytest tests/hermes_cli/test_run_inspector_events_api.py -q -o addopts=
    status: completed
    risk: medium

  - id: HRIE-04
    title: Record dashboard chat events into the ledger
    description: Record sanitized events received by /api/pub before rebroadcasting them to existing chat subscribers.
    depends_on:
      - HRIE-03
    acceptance:
      - Existing /api/pub to /api/events broadcast behavior is unchanged.
      - tool.start, tool.progress, and tool.complete frames produce ledger events.
      - Invalid or malformed frames are ignored safely.
      - Event recording never blocks or crashes chat event broadcast.
    verify:
      - venv/Scripts/python.exe -m pytest tests/hermes_cli/test_web_server.py::TestWebServerWebSockets tests/hermes_cli/test_run_inspector_events_api.py -q -o addopts=
    status: completed
    risk: medium

  - id: HRIE-05
    title: Add Run Inspector event timeline UI
    description: Add a frontend hook and timeline card that show recent and live Run Inspector events.
    depends_on:
      - HRIE-04
    acceptance:
      - Timeline shows empty, connected, disconnected, and populated states.
      - Timeline values are formatted safely and do not overflow.
      - Auth failure stops live event retries.
      - UI remains read-only.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
    status: completed
    risk: medium

  - id: HRIE-06
    title: Verify event integration slice
    description: Re-run backend, frontend, build, and browser smoke checks for the event timeline.
    depends_on:
      - HRIE-05
    acceptance:
      - Backend event tests pass.
      - Frontend event tests pass.
      - Build passes.
      - Browser smoke confirms /run-inspector renders with the timeline and no horizontal overflow.
    verify:
      - venv/Scripts/python.exe -m pytest tests/runtime/test_run_inspector_events.py tests/hermes_cli/test_run_inspector_events_api.py tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - Playwright smoke for /run-inspector
    status: completed
    risk: high

  - id: HRIG-01
    title: Mirror gateway run lifecycle events into Run Inspector
    description: Add best-effort source-side mirroring from APIServerAdapter run lifecycle events into the Run Inspector event ledger.
    depends_on:
      - HRIE-06
    acceptance:
      - Gateway /v1/runs/{run_id}/events SSE behavior is unchanged.
      - run.started, run.running, run.completed, run.failed, run.cancelled, approval.request, tool.started, and tool.completed events can be mirrored as gateway_run events.
      - Tool previews and raw final output are not mirrored into the Run Inspector event ledger.
      - Run Inspector mirroring failures never break gateway run handling.
      - PRD documents that in-memory mirroring is process-local and cross-process forwarding needs a later explicit bridge.
    verify:
      - venv/Scripts/python.exe -m pytest tests/gateway/test_api_server_runs.py::TestRunEvents -q -o addopts=
    status: completed
    risk: medium

  - id: HRIG-02
    title: Verify gateway event source mirroring slice
    description: Re-run gateway, frontend event timeline, build, and diff checks for the gateway source mirroring slice.
    depends_on:
      - HRIG-01
    acceptance:
      - Gateway run event tests pass.
      - Frontend event timeline tests pass.
      - Build passes.
      - Diff check passes.
    verify:
      - venv/Scripts/python.exe -m pytest tests/gateway/test_api_server_runs.py::TestRunEvents tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - git diff --check for HRIG files
    status: completed
    risk: medium

  - id: HRIGF-01
    title: Add cross-process gateway run event forwarder
    description: Add a protected dashboard backend bridge that follows configured gateway /v1/runs/{run_id}/events SSE streams into the Run Inspector event ledger.
    depends_on:
      - HRIG-02
    acceptance:
      - Browser code does not receive or submit gateway bearer tokens.
      - Missing gateway event configuration returns a clear 409.
      - Invalid gateway event URL or run id returns a bounded validation error.
      - Gateway SSE frames are normalized through the Run Inspector event contract.
      - Tool preview text and final run output are not recorded into the event ledger.
      - Forwarder failures record a short gateway.forwarder.failed event without breaking /api/run-inspector/events.
    verify:
      - venv/Scripts/python.exe -m pytest tests/runtime/test_run_inspector_gateway_forwarder.py tests/hermes_cli/test_run_inspector_gateway_forwarder_api.py -q -o addopts=
    status: completed
    risk: high

  - id: HRIGF-02
    title: Verify cross-process gateway event forwarder slice
    description: Re-run runtime, API, frontend event timeline, build, and diff checks for the gateway event forwarder.
    depends_on:
      - HRIGF-01
    acceptance:
      - Gateway forwarder runtime and API tests pass.
      - Existing Run Inspector event API tests pass.
      - Frontend event timeline tests and build pass.
      - Diff check passes.
    verify:
      - venv/Scripts/python.exe -m pytest tests/runtime/test_run_inspector_gateway_forwarder.py tests/hermes_cli/test_run_inspector_gateway_forwarder_api.py tests/hermes_cli/test_run_inspector_events_api.py tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - git diff --check for HRIGF files
    status: completed
    risk: medium

  - id: HRIGF-03
    title: Add dashboard gateway run follow control
    description: Add a Run Inspector panel control for entering a known gateway run_id and starting the cross-process event forwarder.
    depends_on:
      - HRIGF-02
    acceptance:
      - Run Inspector page exposes a run_id input, Follow action, and Status refresh action.
      - The UI calls the protected dashboard forwarder endpoints, not the gateway directly.
      - Gateway bearer token names or values are never exposed in frontend code.
      - Forwarder state, updated time, event count, gateway URL, and short error state are rendered with overflow guards.
      - The existing event timeline refreshes after follow/status calls.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py -q -o addopts=
      - npm.cmd run build
      - Playwright smoke for /run-inspector
    status: completed
    risk: medium

  - id: HRIGF-04
    title: Verify dashboard gateway follow control slice
    description: Re-run frontend, backend forwarder, build, and browser smoke checks for the gateway follow control.
    depends_on:
      - HRIGF-03
    acceptance:
      - Frontend policy tests pass.
      - Gateway forwarder API/runtime tests pass.
      - Build passes.
      - Browser smoke confirms /run-inspector renders the Gateway Run Follow card without horizontal overflow.
    verify:
      - venv/Scripts/python.exe -m pytest tests/web/test_run_inspector_status_policy.py tests/runtime/test_run_inspector_gateway_forwarder.py tests/hermes_cli/test_run_inspector_gateway_forwarder_api.py -q -o addopts=
      - npm.cmd run build
      - Playwright smoke for /run-inspector
      - git diff --check for HRIGF UI files
    status: completed
    risk: medium

risk_flags:
  destructive_file_change:
    pause: true
    examples:
      - deleting files
      - broad refactors outside the run-inspector slice
  database_migration:
    pause: true
    examples:
      - persistent state schema change
      - session storage migration
  external_api_write:
    pause: true
    examples:
      - posting to Slack, Telegram, GitHub, or remote MCP services
  credential_or_secret_access:
    pause: true
    examples:
      - reading tokens
      - writing secrets to logs or snapshots
  public_contract_change:
    pause: true
    examples:
      - changing existing API response fields
      - changing status endpoint semantics without versioning
  user_visible_behavior_change:
    pause: false
    examples:
      - adding a new read-only CLI command
      - adding optional fields to a versioned inspector payload
  config_mutation:
    pause: true
    examples:
      - changing config.yaml
      - changing .env or provider profile files
      - auto-incrementing gateway ports
  platform_specific_execution:
    pause: true
    examples:
      - adding subprocess execution paths
      - assuming /bin/bash
      - assuming venv/bin/python on Windows
  infinite_loading_or_retry_loop:
    pause: true
    examples:
      - polling without timeout
      - unauthenticated retry loops
      - spinner state without degraded fallback
  ui_privacy_leak:
    pause: true
    examples:
      - rendering raw prompts
      - rendering raw logs
      - rendering full tool arguments
      - rendering secret-looking environment values

