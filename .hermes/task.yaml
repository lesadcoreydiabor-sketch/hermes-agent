failure_review:
  enabled: true
  trigger_on:
    - failed_verification
    - blocked_task
    - repeated_tool_error
    - redaction_failure
    - user_interruption
    - infinite_loading
    - auth_retry_loop
    - ui_privacy_leak
  record:
    - what_happened
    - why_it_failed
    - what_changed
    - how_it_was_verified
    - added_eval_or_badcase
  entries:
    - trigger: failed_verification
      task_id: HRI-01
      what_happened: "Initial schema test expected the redactor to preserve the sk-proj prefix, but HERMES redacts environment assignment values to OPENAI_API_KEY=***."
      why_it_failed: "The test expectation was less strict than the existing agent.redact behavior."
      what_changed: "Updated the test to assert the safer existing OPENAI_API_KEY=*** output."
      how_it_was_verified: "Re-ran venv/Scripts/python.exe -m pytest tests/runtime/test_run_snapshot_schema.py -q -o addopts= and all 6 tests passed."
      added_eval_or_badcase: "tests/runtime/test_run_snapshot_schema.py::test_snapshot_redacts_secret_like_text_fields"
    - trigger: failed_verification
      task_id: HRI-03
      what_happened: "Configured-only MCP servers with an empty config dict were classified as failed instead of unknown/not_connected."
      why_it_failed: "The implementation used truthiness of the config dict rather than membership in configured_servers."
      what_changed: "Changed summarize_mcp_servers to treat name presence in configured_servers as configured, even when the config value is an empty dict."
      how_it_was_verified: "Re-ran venv/Scripts/python.exe -m pytest tests/runtime/test_run_snapshot_schema.py tests/runtime/test_run_snapshot_session.py tests/runtime/test_run_snapshot_tools_mcp.py -q -o addopts= and all 19 tests passed."
      added_eval_or_badcase: "tests/runtime/test_run_snapshot_tools_mcp.py::test_mcp_summary_reports_connected_failed_degraded_and_configured_unknown"
    - trigger: repeated_unknown_state
      task_id: HRI-06
      what_happened: "Simulated three Run Inspector snapshots returning status=unknown with degraded_reason=gateway_state_unknown."
      why_it_failed: "Repeated unknown state would hide an inspector classification gap if it occurred in real runs."
      what_changed: "Added FailureReviewEntry, redaction-failure blocker behavior, repeated unknown-state detection, and task.yaml append helper."
      how_it_was_verified: "Re-ran venv/Scripts/python.exe -m pytest tests/runtime/test_run_snapshot_schema.py tests/runtime/test_run_snapshot_session.py tests/runtime/test_run_snapshot_tools_mcp.py tests/runtime/test_run_snapshot_redaction.py tests/runtime/test_run_snapshot_failure_review.py tests/hermes_cli/test_run_status.py -q -o addopts= and all 34 tests passed."
      added_eval_or_badcase: "tests/runtime/test_run_snapshot_failure_review.py::test_repeated_unknown_state_creates_regression_entry"
      blocker: false
    - trigger: failed_verification
      task_id: HRI-06
      what_happened: "A new degradation test expected empty fallback snapshots to include redacted/local_only privacy flags, but empty_run_snapshot intentionally returns only safe."
      why_it_failed: "The test conflated a fully assembled Run Inspector snapshot with the existing empty snapshot schema."
      what_changed: "Kept the runtime degradation behavior and updated the test to assert the existing safe-only empty snapshot contract."
      how_it_was_verified: "Re-ran venv/Scripts/python.exe -m pytest tests/hermes_cli/test_status.py tests/hermes_cli/test_run_status.py tests/runtime/test_run_snapshot_schema.py tests/runtime/test_run_snapshot_session.py tests/runtime/test_run_snapshot_tools_mcp.py tests/runtime/test_run_snapshot_redaction.py tests/runtime/test_run_snapshot_failure_review.py -q -o addopts= and all 39 tests passed."
      added_eval_or_badcase: "tests/hermes_cli/test_run_status.py::test_run_inspector_status_degrades_when_snapshot_build_fails"
      blocker: false
    - trigger: failed_verification
      task_id: HRIGF-04
      what_happened: "Initial Playwright smoke used document.body.innerText to detect the Gateway Run Follow title even though Playwright's text locator found the card and the input was visible."
      why_it_failed: "The smoke assertion mixed locator-based visibility with a brittle body text snapshot."
      what_changed: "Changed the smoke to assert locator counts for the card title and input while keeping the horizontal overflow checks."
      how_it_was_verified: "Re-ran Playwright smoke for desktop and narrow viewports; both found the title/input and had scrollWidth equal to viewport width."
      added_eval_or_badcase: "manual Playwright smoke for /run-inspector Gateway Run Follow"
      blocker: false
