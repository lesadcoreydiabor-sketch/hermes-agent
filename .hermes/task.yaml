      - venv/Scripts/python.exe -c "import yaml; yaml.safe_load(open('.hermes/task.yaml', encoding='utf-8'))"
    status: pending
    risk: medium

risk_flags:
  destructive_file_change:
    pause: true
    examples:
      - deleting files
      - broad refactors outside the run-inspector slice
  database_migration:
    pause: true
    examples:
      - persistent state schema change
      - session storage migration
  external_api_write:
    pause: true
    examples:
      - posting to Slack, Telegram, GitHub, or remote MCP services
  credential_or_secret_access:
    pause: true
    examples:
      - reading tokens
      - writing secrets to logs or snapshots
  public_contract_change:
    pause: true
    examples:
      - changing existing API response fields
      - changing status endpoint semantics without versioning
  user_visible_behavior_change:
    pause: false
    examples:
      - adding a new read-only CLI command
      - adding optional fields to a versioned inspector payload
  config_mutation:
    pause: true
    examples:
      - changing config.yaml
      - changing .env or provider profile files
      - auto-incrementing gateway ports
  platform_specific_execution:
    pause: true
    examples:
      - adding subprocess execution paths
      - assuming /bin/bash
      - assuming venv/bin/python on Windows
  infinite_loading_or_retry_loop:
    pause: true
    examples:
      - polling without timeout
      - unauthenticated retry loops
      - spinner state without degraded fallback
  ui_privacy_leak:
    pause: true
    examples:
      - rendering raw prompts
      - rendering raw logs
      - rendering full tool arguments
      - rendering secret-looking environment values
  unreviewed_memory_or_skill_mutation:
    pause: true
    examples:
      - automatically editing SKILL.md
      - silently writing accepted long-term memory facts
      - applying skills_journal entries without review
  multi_agent_ownership_conflict:
    pause: true
    examples:
      - parallel workers writing the same file set
      - changing shared API contracts without a coordinating owner
      - child agents mutating sibling task state
  ledger_or_checkpoint_privacy_leak:
    pause: true
    examples:
      - recording raw transcripts
      - recording command output or diffs
      - recording provider memory payloads

